# Reusable release workflow for tittle-xyz Go services.
#
# Conventional Commits -> release-please maintains a release PR; merging it tags
# the version, writes the CHANGELOG, and builds/pushes a container image to GHCR
# tagged with the release.
#
# The image build is inlined behind the `release_created` gate rather than living
# in an `on: release` workflow, because a tag created by release-please's
# GITHUB_TOKEN does not trigger `release` or `push: tags` events.
#
# Caller:
#
#   permissions:
#     contents: write
#     pull-requests: write
#     packages: write
#   jobs:
#     release:
#       uses: tittle-xyz/go-shared-build/.github/workflows/go-release-image.yml@v1
name: go-release-image

on:
  workflow_call:
    inputs:
      release-type:
        description: >-
          release-please strategy, for repos with no release-please-config.json.
          Leave empty (the default) when the repo ships that config: passing
          release-type puts the action into non-manifest mode, where the config
          file and .release-please-manifest.json are ignored entirely — which
          silently produces a first release of 1.0.0 instead of the manifest's
          starting version.
        type: string
        required: false
        default: ""
      image-name:
        description: "Image name under ghcr.io/<owner>/. Defaults to the repo name."
        type: string
        required: false
        default: ""
      platforms:
        description: "Comma-separated build platforms."
        type: string
        required: false
        default: linux/amd64
      context:
        description: "Docker build context."
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to the Dockerfile."
        type: string
        required: false
        default: Dockerfile
      latest-tag:
        description: "Also push the :latest tag alongside the version tag."
        type: boolean
        required: false
        default: false
      binaries:
        description: >-
          Also build and attach CLI binaries with GoReleaser, for a repo that
          ships a command-line tool alongside its image. Requires a
          .goreleaser.yaml. One release, both artifact kinds — release-please
          can only run once per release, so this cannot be a second workflow.
        type: boolean
        required: false
        default: false

    secrets:
      RELEASE_PLEASE_TOKEN:
        description: >-
          Token release-please authors its pull request with. Optional, but
          without it the PR is created by github-actions[bot], and GitHub will
          not run workflows for bot-created events without a human approving
          each one — which also leaves the PR blocked when required status
          checks are enabled. Falls back to github.token when unset.
        required: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: ${{ inputs.release-type }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.release_created }}
        with:
          # GoReleaser needs full history and tags to resolve the version it is
          # building. Quoted '0'/'1' on purpose: in a GitHub expression the number
          # 0 is falsy, so `inputs.binaries && 0 || 1` silently yields 1 even when
          # binaries is true. Non-empty strings are truthy, so this works.
          fetch-depth: ${{ inputs.binaries && '0' || '1' }}
          fetch-tags: ${{ inputs.binaries }}

      - name: Resolve image name
        if: ${{ steps.release.outputs.release_created }}
        id: image
        env:
          OVERRIDE: ${{ inputs.image-name }}
        run: |
          set -euo pipefail
          name="${OVERRIDE:-${GITHUB_REPOSITORY#*/}}"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${name}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: ${{ steps.release.outputs.release_created }}

      - name: Log in to GHCR
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: ${{ steps.release.outputs.release_created }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.ref }}
          # `value=` is load-bearing. Without it, type=semver reads the version out
          # of `github.ref` — and under workflow_call that is the CALLER's ref
          # (refs/heads/main), not the tag, so it would silently emit no version
          # tag. release-please hands us the version; feeding it in explicitly is
          # what makes this correct. (Learned the hard way in alpaca-monitor.)
          #
          # No v{{major}}.{{minor}} alias is emitted — that tag moves with every
          # patch, which is exactly the mutability a pinned deploy exists to escape.
          tags: |
            type=semver,pattern=v{{version}},value=${{ steps.release.outputs.tag_name }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ inputs.latest-tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag_name }}

      - name: Build and push
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub Actions storage; without it every release
          # recompiles the whole image from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CLI binaries, for a repo that ships both an image and a command-line tool.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ steps.release.outputs.release_created && inputs.binaries }}
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        if: ${{ steps.release.outputs.release_created && inputs.binaries }}
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
