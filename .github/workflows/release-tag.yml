# Reusable release workflow for repos that release nothing but a tag.
#
# For projects with no build artifact — build tooling, config, docs. Conventional
# Commits drive a release-please PR; merging it bumps the version, writes the
# CHANGELOG, and creates the tag and GitHub Release. Nothing is compiled or
# published.
#
# Go projects want go-release-cli.yml (binaries) or go-release-image.yml (image)
# instead; both do this plus the artifact build.
#
# Caller:
#
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     release:
#       uses: tittle-xyz/go-shared-build/.github/workflows/release-tag.yml@v0.1.0
name: release-tag

on:
  workflow_call:
    inputs:
      release-type:
        description: >-
          release-please strategy, for repos with no release-please-config.json.
          Leave empty (the default) when the repo ships that config: passing
          release-type puts the action into non-manifest mode, where the config
          file and .release-please-manifest.json are ignored entirely — which
          silently produces a first release of 1.0.0 instead of the manifest's
          starting version.
        type: string
        required: false
        default: ""
    outputs:
      release_created:
        description: "true when this run created a release."
        value: ${{ jobs.release.outputs.release_created }}
      tag_name:
        description: "Tag of the release just created, if any."
        value: ${{ jobs.release.outputs.tag_name }}

    secrets:
      RELEASE_PLEASE_TOKEN:
        description: >-
          Token release-please authors its pull request with. Optional, but
          without it the PR is created by github-actions[bot], and GitHub will
          not run workflows for bot-created events without a human approving
          each one — which also leaves the PR blocked when required status
          checks are enabled. Falls back to github.token when unset.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Picks up release-please-config.json and .release-please-manifest.json
      # automatically when they exist; falls back to the release-type input.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: ${{ inputs.release-type }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
